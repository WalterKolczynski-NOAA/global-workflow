name: PR CI Pipeline for Ursa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci_pr_ursa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUNTESTS: /scratch3/NAGAPE/epic/Walter.Kolczynski/noscrub/stmp/GH_RUNS/PR_${{ github.event.pull_request.number }}_${{ github.event.pull_request.head.sha }}

jobs:
  gen_test_list:
    name: Generate test list
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: ${{ contains(github.event.pull_request.labels.*.name, 'CI-Ursa') }}

    outputs:
      test_list: ${{ steps.test_list.outputs.test_list }}
    
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
          submodules: false

      - name: List tests
        id: test_list
        shell: bash
        # Get the list of tests that will be run so we can use it as a matrix 
        run: |
          set -euo pipefail
          json="$( \
            MACHINE_ID='ursa' dev/workflow/generate_workflows.sh -L -GECS 2> /dev/null \
            | tail -n +9 \
            | jq -RMn --indent 0 '[inputs | select(length > 0)]')"

          echo "test_list=${json}" >> "$GITHUB_OUTPUT"

  run_tests:
    name: Run tests
    needs: gen_test_list
    runs-on: ursa
    timeout-minutes: 1440

    strategy:
      fail-fast: true
      matrix:
        test: ${{ fromJSON(needs.gen_test_list.outputs.test_list) }}

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
          submodules: recursive

      - name: Build Global Workflow
        run: sorc/build_all.sh -cA epic all

      - name: Link Global Workflow
        run: sorc/link_workflow.sh      

      - name: Generate test experiments
        run: dev/workflow/generate_workflows.sh -A epic -GECS -D "${{ env.RUNTESTS }}"

      - name: Run and monitor PR test ${{ matrix.test }}
        run: dev/ci/scripts/run_check_ci.sh "${{ env.RUNTESTS }}" "${{ matrix.test }}"
