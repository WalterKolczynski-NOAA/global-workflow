name: PR CI Pipeline

on:
  # Use request target to prevent running GH actions modified by PR 
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci_pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# CI_RUN_ROOT is set by the GH "deployment" environment
env:
  PR_ROOT: ${{ vars.CI_RUN_ROOT }}/PR_${{ github.event.pull_request.number }}

jobs:
  define-machines:
    name: Define machines
    runs-on: ubuntu-latest
    environment:
      name: define-machines
      deployment: false
    outputs:
      machines: ${{ steps.set_machines.outputs.machines }}
    
    steps:
      - name: Set machines
        id: set_machines
        shell: bash
        run: |
          echo 'machines=${{ vars.machines }}' >> "$GITHUB_OUTPUT"

  gate:
    # Requires approval by specific users before running
    name: Self-Hosted Gate
    needs: define-machines
    runs-on: ubuntu-latest
    environment:
      name: self-hosted-approved
      deployment: false
    timeout-minutes: 5

    strategy:
      matrix:
        machine: ${{ fromJSON(needs.define-machines.outputs.machines) }}

    if: github.repository == 'WalterKolczynski-NOAA/global-workflow'

    steps:
      - name: Approval
        shell: bash
        run: |
          echo "Workflow approved for ${{ matrix.machine }}, proceeding"

  build:
    name: Build Global Workflow
    needs: [define-machines, gate]
    runs-on: ${{ matrix.machine }}
    environment:
      name: ${{ matrix.machine }}
      deployment: false
    timeout-minutes: 1440

    strategy:
      matrix:
        machine: ${{ fromJSON(needs.define-machines.outputs.machines) }}

    outputs:
      test_list: ${{ steps.list_tests.outputs.test_list }}
    
    steps:
      # We cannot use GH env to define new env in the GH action,
      #   so if we want to have derived variables, we have to do
      #   it in bash and add to the environment.
      - name: Define paths
        shell: bash
        run: |
          PR_DIR=${{ env.PR_ROOT }}/${{ github.event.pull_request.head.sha }}
          BUILD_ROOT=${PR_DIR}/global-workflow
          RUNTESTS="${PR_DIR}/RUNTESTS"
          echo "PR_DIR=${PR_DIR}" >> $GITHUB_ENV
          echo "BUILD_ROOT=${BUILD_ROOT}" >> $GITHUB_ENV
          echo "RUNTESTS=${RUNTESTS}" >> $GITHUB_ENV

      # We need to check the code out in a specific location for use later,
      #   so we have to check out the code manually instead of using the GH action
      - name: Checkout merge commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ env.PR_DIR }}"
          mkdir -p "${{ env.BUILD_ROOT }}"
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" "${{ env.BUILD_ROOT }}"
          git -C "${{ env.BUILD_ROOT }}" fetch origin "pull/${{ github.event.pull_request.number }}/merge"
          git -C "${{ env.BUILD_ROOT }}" checkout FETCH_HEAD
          git -C "${{ env.BUILD_ROOT }}" submodule update --init --recursive --jobs 8

      - name: Build Global Workflow
        working-directory: ${{ env.BUILD_ROOT }}
        run: sorc/build_all.sh -cA epic all

      - name: Link Global Workflow
        working-directory: ${{ env.BUILD_ROOT }}
        run: sorc/link_workflow.sh      

      - name: List tests
        id: list_tests
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        # Get the list of tests that will be run so we can use it as a matrix
        run: |
          set -euo pipefail
          json="$( \
            MACHINE_ID='${{ matrix.machine }}' dev/workflow/generate_workflows.sh -L -GECS 2> /dev/null \
            | tail -n +9 \
            | jq -RMn --indent 0 '[inputs | select(length > 0)]')"

          echo "test_list=${json}" >> "$GITHUB_OUTPUT"

      - name: Generate test experiments
        working-directory: ${{ env.BUILD_ROOT }}/dev/workflow
        run: ./generate_workflows.sh -A epic -GECS -D "${{ env.RUNTESTS }}"

  run_tests:
    name: Run tests
    needs: [define-machines, build]
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 1440
    environment:
      name: ${{ matrix.machine }}
      deployment: false
    
    strategy:
      fail-fast: true
      matrix:
        machine: ${{ fromJSON(needs.define-machines.outputs.machines) }}
        test: ${{ fromJSON(needs.build.outputs.test_list) }}

    steps:
      - name: Define paths
        shell: bash
        run: |
          PR_DIR=${{ env.PR_ROOT }}/${{ github.event.pull_request.head.sha }}
          BUILD_ROOT=${PR_DIR}/global-workflow
          echo "PR_DIR=${PR_DIR}" >> $GITHUB_ENV
          echo "BUILD_ROOT=${BUILD_ROOT}" >> $GITHUB_ENV

      - name: Run and monitor PR test ${{ matrix.test }}
        working-directory: ${{ env.BUILD_ROOT }}
        run: dev/ci/scripts/run_check_ci.sh "${{ env.PR_DIR }}" "${{ matrix.test }}"

  cleanup:
    name: Cleanup
    needs: [define-machines, run_tests]
    runs-on: ${{ matrix.machine }}
    timeout-minutes: 1440
    environment:
      name: ${{ matrix.machine }}
      deployment: false

    strategy:
      fail-fast: true
      matrix:
        machine: ${{ fromJSON(needs.define-machines.outputs.machines) }}

    steps:
      - name: Cleanup up PR directory
        shell: bash
        run: |
          rm -rf "${{ env.PR_ROOT }}"
