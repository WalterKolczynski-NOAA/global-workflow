name: PR CI Pipeline for Ursa

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci_pr_ursa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_DIR: /scratch3/NAGAPE/epic/Walter.Kolczynski/noscrub/stmp/GH_RUNS/PR_${{ github.event.pull_request.number }}_${{ github.event.pull_request.head.sha }}

jobs:
  build:
    name: Build Global Workflow
    runs-on: ursa
    timeout-minutes: 1440

    env:
      BUILD_ROOT: ${{ env.PR_DIR }}//global-workflow

    if: ${{ contains(github.event.pull_request.labels.*.name, 'CI-Ursa') }}

    outputs:
      test_list: ${{ steps.list_tests.outputs.test_list }}
    
    steps:
      # We need to check the code out in a specific location for use later,
      #   so we have to check out the code manually instead of using the GH action
      - name: Prepare shared build root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ env.PR_DIR }}"
          mkdir -p "${{ env.BUILD_ROOT }}"
          git clone --depth 1 "${{ github.event.pull_request.head.repo.clone_url }}" "${{ env.BUILD_ROOT }}"
          git -C "${{ env.BUILD_ROOT }}" fetch origin "${{ github.event.pull_request.head.ref }}"
          git -C "${{ env.BUILD_ROOT }}" checkout FETCH_HEAD
          git -C "${{ env.BUILD_ROOT }}" submodule update --init --recursive --jobs 8

      - name: Build Global Workflow
        working-directory: ${{ env.BUILD_ROOT }}
        run: sorc/build_all.sh -cA epic all

      - name: Link Global Workflow
        working-directory: ${{ env.BUILD_ROOT }}
        run: sorc/link_workflow.sh      

      - name: List tests
        id: list_tests
        working-directory: ${{ env.BUILD_ROOT }}
        shell: bash
        # Get the list of tests that will be run so we can use it as a matrix 
        run: |
          set -euo pipefail
          json="$( \
            MACHINE_ID='ursa' dev/workflow/generate_workflows.sh -L -GECS 2> /dev/null \
            | tail -n +9 \
            | jq -RMn --indent 0 '[inputs | select(length > 0)]')"

          echo "test_list=${json}" >> "$GITHUB_OUTPUT"

  run_tests:
    name: Run tests
    needs: build
    runs-on: ursa
    timeout-minutes: 1440

    env:
      BUILD_ROOT: ${{ env.PR_DIR }}/global-workflow
      RUNTESTS: ${{ env.PR_DIR }}/RUNTESTS

    strategy:
      fail-fast: true
      matrix:
        test: ${{ fromJSON(needs.build.outputs.test_list) }}

    steps:
      - name: Generate test experiments
        working-directory: ${{ env.BUILD_ROOT }}
        run: dev/workflow/generate_workflows.sh -A epic -GECS -D "${{ env.RUNTESTS }}"

      - name: Run and monitor PR test ${{ matrix.test }}
        working-directory: ${{ env.BUILD_ROOT }}
        run: dev/ci/scripts/run_check_ci.sh "${{ env.RUNTESTS }}" "${{ matrix.test }}"
