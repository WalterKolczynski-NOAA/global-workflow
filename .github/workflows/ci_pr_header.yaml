name: PR CI Header

on:
  # Use request target to prevent running GH actions modified by PR 
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

obs:
  ursa:
    uses: $/.github/workflows/ci_pr.yaml
    with:
      machine: ursa
  hercules:    
    uses: $/.github/workflows/ci_pr.yaml
    with:
      machine: hercules
