name: PR CI Header

on:
  # Use request target to prevent running GH actions modified by PR 
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Get a shortened version of the sha to reduce path lengths
  get_short_sha:
    runs-on: ubuntu-slim
    outputs:
      short_sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: short_sha
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Shortened sha: ${PR_HEAD_SHA::7}"
          echo "short_sha=${PR_HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

  # List all the possible machines to run CI on
  # Two GH environments will need to be created in the repo
  #   for each machine:
  #   - ${machine}
  #     Must contain an environment variable CI_RUN_ROOT
  #       containing the path where the CI should run
  #   - self-hosted-${machine}
  #     Should be protected by having a Required reviewers
  #       list. This is the list of people who can approve
  #       the CI to run on that machine's self-hosted runners
  #
  # Self-hosted runners will also need to be established on
  #   each machine. They can be named anything (though it is
  #   recommended you use consecutive numbers), but all must
  #   be labeled with the machine name. See <runner setup
  #   script> to easily establish runners.
  #
  # Each machine has a separate approval, allowing some
  #   machines to be skipped if desired.
  #
  ursa:
    uses: $/.github/workflows/ci_pr.yaml
    needs: get_short_sha
    with:
      machine: ursa
      pr_number: ${{ github.event.pull_request.number }}
      run_id: ${{ needs.get_short_sha.outputs.short_sha }}
  hercules:    
    uses: $/.github/workflows/ci_pr.yaml
    needs: get_short_sha
    with:
      machine: hercules
      pr_number: ${{ github.event.pull_request.number }}
      run_id: ${{ needs.get_short_sha.outputs.short_sha }}
