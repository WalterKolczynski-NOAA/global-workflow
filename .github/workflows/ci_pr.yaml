name: PR CI Pipeline
#
on:
  workflow_call:
    inputs:
      machine:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      run_id:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

# Limit one running set of tests per machine/PR combo
concurrency:
  group: ci_pr-${{ inputs.machine }}-${{ inputs.pr_number }}
  cancel-in-progress: true

# CI_RUN_ROOT is set by the GH "deployment" environment for the machine
env:
  PR_ROOT: ${{ vars.CI_RUN_ROOT }}/PR_${{ inputs.pr_number }}

jobs:
  gate:
    # Requires approval by specific users before running
    name: Self-Hosted Gate
    runs-on: ubuntu-slim
    environment:
      name: self-hosted-${{ inputs.machine }}
      deployment: false
    timeout-minutes: 5

    # Restricts to only run on master repository
    if: github.repository == 'WalterKolczynski-NOAA/global-workflow'

    steps:
      - name: Approval
        shell: bash
        run: |
          echo "Workflow approved for ${{ inputs.machine }}, proceeding"

  build:
    name: Build Global Workflow
    needs: gate
    runs-on: ${{ inputs.machine }}
    environment:
      name: ${{ inputs.machine }}
      deployment: false
    timeout-minutes: 1440

    outputs:
      test_list: ${{ steps.list_tests.outputs.test_list }}

    steps:
      # We cannot use GH env to define new env in the GH action, so if we want
      #   to have derived variables, we have to do it in bash and add to the
      #   environment.
      - name: Define paths
        shell: bash
        run: |
          PR_DIR=${{ env.PR_ROOT }}/${{ inputs.run_id }}
          BUILD_ROOT=${PR_DIR}/global-workflow
          RUNTESTS="${PR_DIR}/RUNTESTS"
          echo "PR_DIR=${PR_DIR}" >> $GITHUB_ENV
          echo "BUILD_ROOT=${BUILD_ROOT}" >> $GITHUB_ENV
          echo "RUNTESTS=${RUNTESTS}" >> $GITHUB_ENV

      # We need to check the code out in a specific location for use later, so
      #   we have to check out the code manually instead of using the GH action
      - name: Checkout merge commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${PR_DIR}"
          mkdir -p "${BUILD_ROOT}"
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" "${BUILD_ROOT}"
          git -C "${BUILD_ROOT}" fetch origin "pull/${{ inputs.pr_number }}/merge"
          git -C "${BUILD_ROOT}" checkout FETCH_HEAD
          git -C "${BUILD_ROOT}" submodule update --init --recursive --jobs 8

      - name: Build Global Workflow
        shell: bash
        run: |
          cd "${BUILD_ROOT}"
          sorc/build_all.sh -cA epic all

      - name: Link Global Workflow
        shell: bash
        run: |
          cd "${BUILD_ROOT}"
          sorc/link_workflow.sh

      - name: List tests
        id: list_tests
        shell: bash
        # Get the list of tests that will be run so we can use it as a matrix
        run: |
          set -euo pipefail
          cd "${BUILD_ROOT}"
          json="$( \
            MACHINE_ID='${{ inputs.machine }}' dev/workflow/generate_workflows.sh -L -GECS 2> /dev/null \
            | tail -n +9 \
            | python3 -c 'import json, sys; rows=[line.strip() for line in sys.stdin if line.strip()]; print(json.dumps(rows))')"

          echo "test_list=${json}" >> "$GITHUB_OUTPUT"

      - name: Generate test experiments
        shell: bash
        run: |
          cd "${BUILD_ROOT}/dev/workflow"
          ./generate_workflows.sh -A epic -GECS -D "${RUNTESTS}" -t "${{ inputs.pr_number }}"

  run_tests:
    name: Run tests
    needs: build
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 1440
    environment:
      name: ${{ inputs.machine }}
      deployment: false

    strategy:
      fail-fast: true
      matrix:
        test: ${{ fromJSON(needs.build.outputs.test_list) }}

    steps:
      # - name: Define paths
      #   shell: bash
      #   run: |
      #     PR_DIR=${{ env.PR_ROOT }}/${{ inputs.run_id }}
      #     BUILD_ROOT=${PR_DIR}/global-workflow
      #     echo "PR_DIR=${PR_DIR}" >> $GITHUB_ENV
      #     echo "BUILD_ROOT=${BUILD_ROOT}" >> $GITHUB_ENV

      - name: Run and monitor PR test ${{ matrix.test }}
        shell: bash
        run: |
          cd "${{ env.PR_ROOT }}/${{ inputs.run_id }}/global-workflow"
          # Sleep a random number of seconds between 0-120 to avoid overloading runners
          # sleep $((RANDOM % 121)) && echo "starting..."
          dev/ci/scripts/run_check_ci.sh "${{ env.PR_ROOT }}/${{ inputs.run_id }}" "${{ matrix.test }}_${{ inputs.pr_number }}" | tee dev/ci/scripts/run_check_ci.${{ matrix.test }}.log

  cleanup:
    name: Cleanup
    needs: run_tests
    runs-on: ${{ inputs.machine }}
    timeout-minutes: 1440
    environment:
      name: ${{ inputs.machine }}
      deployment: false

    steps:
      - name: Cleanup up PR directory
        shell: bash
        run: |
          rm -rf "${{ env.PR_ROOT }}"
